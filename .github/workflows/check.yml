name: Check and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04  # Python 3.9 (the minimum supported) is not available on newer runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix web
      - run: npm --prefix web run check
      - run: npm --prefix web run build
      - name: Core browser journeys
        run: |
          cd web
          npx playwright install --with-deps chromium
          cd ..
          python3 tools/e2e.py e2e/box.spec.ts e2e/counts.spec.ts e2e/comments.spec.ts e2e/docedit.spec.ts
      - name: Use the minimum supported runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build and smoke-test the standalone release on Python 3.9
        run: |
          python3 tools/build_pyz.py --skip-web
          python3 tools/check_package.py dist/taska.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: taska.pyz
          path: dist/taska.pyz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taska.pyz
          path: dist
      - name: Publish the release (unless tools/release.py's command already did)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released; its assets stay as published"
            exit 0
          fi
          (cd dist && sha256sum taska.pyz > taska.pyz.sha256)
          gh release create "$GITHUB_REF_NAME" dist/taska.pyz dist/taska.pyz.sha256 install.sh \
            --title "Taska $GITHUB_REF_NAME" \
            --notes "Install on Linux: curl -fsSL https://github.com/$GH_REPO/releases/latest/download/install.sh | sh"
